name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Test
        run: make test

      - name: Release build
        run: xcodebuild -scheme MacEmojis -configuration Release -derivedDataPath build-release CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
