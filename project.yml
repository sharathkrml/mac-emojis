name: MacEmojis
options:
  bundleIdPrefix: com.sharath
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    # Emo's Core AI path does not compile for x86_64 on macOS.
    ARCHS: arm64
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  DesertAntCore:
    url: https://github.com/Desert-Ant-Labs/desert-ant-core.git
    exactVersion: 4.3.0
targets:
  MacEmojis:
    type: application
    platform: macOS
    sources:
      - path: MacEmojis
    dependencies:
      - package: DesertAntCore
        product: Emo
    info:
      path: MacEmojis/Info.plist
      properties:
        CFBundleName: MacEmojis
        CFBundleDisplayName: MacEmojis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Sharath V. MIT License."
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharath.MacEmojis
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Emo's Core AI path does not compile for x86_64 on macOS.
        ARCHS: arm64
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  MacEmojisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacEmojisTests
    dependencies:
      - target: MacEmojis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharath.MacEmojisTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacEmojis.app/Contents/MacOS/MacEmojis"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MacEmojis:
    build:
      targets:
        MacEmojis: all
        MacEmojisTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacEmojisTests
    archive:
      config: Release
